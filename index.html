<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D'JEJAK APPS</title>
  <link rel="icon" href="https://i.ibb.co.com/GvgLB13T/Chat-GPT-Image-Sep-6-2026-12-03-41-PM.png" />
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0f1020;
      font-family: 'Quicksand', sans-serif, system-ui;
      overflow: hidden;
    }
    
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }

    .logo-container {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 50px; 
    }

    .glow-effect {
      position: absolute;
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #3b82f6, #ec4899);
      border-radius: 50%;
      filter: blur(25px);
      opacity: 0.5;
      animation: pulseGlow 2s infinite alternate;
    }

    .app-logo {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .app-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      text-align: center;
      padding: 0 20px;
    }

    .app-subtitle {
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: none;
      margin: 0 0 24px 0;
      text-align: center;
      padding: 0 20px;
    }

    .loading-bar {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, #3b82f6, #ec4899, transparent);
      animation: loadingSlide 1.5s infinite linear;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.4; }
      100% { transform: scale(1.15); opacity: 0.7; }
    }

    @keyframes loadingSlide {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    iframe { width: 100%; height: 100%; border: none; display: block; }

    /* --- TOMBOL ALTERNATIF / BANTUAN MELAYANG DENGAN ANIMASI --- */
    .fallback-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #3b82f6, #ec4899);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 18px;
      font-family: 'Quicksand', sans-serif;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      cursor: pointer;
      z-index: 9998;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: bounceBtn 2s infinite ease-in-out;
    }

    .fallback-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
    }

    .fallback-btn svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    @keyframes bounceBtn {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen dengan Sapaan Berdasarkan Waktu -->
  <div id="loader">
    <div class="logo-container">
      <div class="glow-effect"></div>
      <img src="https://i.ibb.co.com/GvgLB13T/Chat-GPT-Image-Sep-6-2026-12-03-41-PM.png" alt="Logo" class="app-logo" />
    </div>
    <h1 class="app-title" id="greeting-text">Memuat...</h1>
    <p class="app-subtitle" id="subtitle-text">Menyiapkan Ruang Kerja...</p>
    <div class="loading-bar"></div>
  </div>

  <!-- Tombol Interaktif Animasi untuk Pindah ke Link Alternatif -->
  <button class="fallback-btn" id="switchLinkBtn" onclick="switchToAlternative()" title="Ganti Link Jika Error">
    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    <span>Buka Jalur Alternatif</span>
  </button>

  <iframe
  id="app"
  allowfullscreen="true"
  allow="fullscreen; camera; microphone; display-capture; geolocation; downloads;"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads">
</iframe>

  <script>
    // --- SKRIP OTOMATIS MENENTUKAN UCAPAN & PESAN BERDASARKAN WAKTU ---
    const hours = new Date().getHours();
    let greeting = "Selamat Malam";
    let subMessage = "Alhamdulillah, rehat sejenak Semoga esok lebih baik";
    
    if (hours >= 4 && hours < 11) {
      greeting = "Selamat Pagi";
      subMessage = "Bissmillah, Semoga hari ini penuh keberkahan";
    } else if (hours >= 11 && hours < 15) {
      greeting = "Selamat Siang";
      subMessage = "Semoga langkah hari ini selalu dimudahkan";
    } else if (hours >= 15 && hours < 18) {
      greeting = "Selamat Sore";
      subMessage = "Semoga lelah hari ini menjadi Lillah";
    }

    document.getElementById('greeting-text').innerText = greeting;
    document.getElementById('subtitle-text').innerText = subMessage;

    // --- INISIALISASI APLIKASI & SISTEM SWITCH LINK ---
    const primaryUrl = "https://script.google.com/macros/s/AKfycbz3tGGTqU-cYtCewUHPN4rdK7TYPTdRRE2VBPqUsIFBJ8LI3S5KospcLKGyolr5WRVl/exec";
    const workspaceUrl = "https://script.google.com/a/~/macros/s/AKfycbz3tGGTqU-cYtCewUHPN4rdK7TYPTdRRE2VBPqUsIFBJ8LI3S5KospcLKGyolr5WRVl/exec";

    const iframe = document.getElementById('app');
    const loader = document.getElementById('loader');

    // Cek apakah memori HP sudah pernah diset ke alternatif
    const useAlternative = localStorage.getItem('d_saku_use_alt') === 'true';
    let currentUrl = useAlternative ? workspaceUrl : primaryUrl;
    
    iframe.src = currentUrl;

    // Fungsi tombol interaktif untuk pindah jalur
    function switchToAlternative() {
      const targetUrl = (iframe.src === primaryUrl) ? workspaceUrl : primaryUrl;
      localStorage.setItem('d_saku_use_alt', targetUrl === workspaceUrl ? 'true' : 'false');
      
      // Munculkan kembali loader sebentar agar transisi mulus
      loader.style.display = 'flex';
      loader.style.opacity = '1';
      
      setTimeout(() => {
        iframe.src = targetUrl;
        setTimeout(() => {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 600);
        }, 1000);
      }, 500);
    }

    // Timer loader pembuka splash screen
    window.addEventListener('load', () => {
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 600);
      }, 7500); 
    });
  </script>
</body>
</html>
